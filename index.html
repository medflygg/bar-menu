<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Бар</title>
  <style>
    html, body { margin: 0; background: #000; color: #fff; overflow-x: hidden; max-width: 100%; }
    body { font-family: system-ui, sans-serif; }
    #status {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      background: #000;
    }
    #status[hidden] { display: none; }
    #status p { margin: 0 0 16px; font-size: 16px; }
    .track { width: min(240px, 70vw); height: 3px; background: #222; }
    #bar { height: 100%; width: 0; background: #d6ff00; }
    #pages { position: relative; width: 100%; max-width: 100%; }
    canvas { display: block; max-width: 100%; background: #000; }
    a.link {
      position: absolute;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="status">
    <div>
      <p id="label">Загрузка меню…</p>
      <div class="track"><div id="bar"></div></div>
    </div>
  </div>
  <main id="pages"></main>
  <script type="module">
    const MAX_CANVAS = 4096;

    function rootUrl() {
      const url = new URL(import.meta.url);
      if (!url.pathname.endsWith("/")) {
        if (/\.[a-z0-9]+$/i.test(url.pathname)) url.pathname = url.pathname.replace(/[^/]*$/, "");
        else url.pathname += "/";
      }
      return url;
    }

    const root = rootUrl();
    const statusEl = document.getElementById("status");
    const labelEl = document.getElementById("label");
    const barEl = document.getElementById("bar");
    const pagesEl = document.getElementById("pages");

    function fail(message) {
      labelEl.textContent = message;
      barEl.parentElement.hidden = true;
      statusEl.hidden = false;
    }

    let generation = 0;
    let active = null;
    let pdfDoc = null;

    async function paint() {
      const gen = ++generation;
      try { active?.cancel(); } catch (error) { /* already finished */ }
      const cssWidth = document.documentElement.clientWidth;
      const dpr = window.devicePixelRatio || 1;
      const page = await pdfDoc.getPage(1);
      if (gen !== generation) return;

      const base = page.getViewport({ scale: 1 });
      let bitmapWidth = Math.max(1, Math.round(cssWidth * dpr));
      if (bitmapWidth > MAX_CANVAS) bitmapWidth = MAX_CANVAS;
      const scale = bitmapWidth / base.width;
      const fullHeight = base.height * scale;
      pagesEl.replaceChildren();

      let offset = 0;
      let first = true;
      while (offset < fullHeight - 0.5) {
        if (gen !== generation) return;
        const sliceHeight = Math.min(MAX_CANVAS, Math.ceil(fullHeight - offset));
        const canvas = document.createElement("canvas");
        canvas.width = bitmapWidth;
        canvas.height = sliceHeight;
        canvas.style.width = cssWidth + "px";
        canvas.style.height = (sliceHeight * cssWidth / bitmapWidth) + "px";
        const viewport = page.getViewport({ scale, offsetY: -offset });
        const context = canvas.getContext("2d", { alpha: false });
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = "high";
        const task = page.render({
          canvasContext: context,
          viewport,
          background: "#000000",
        });
        active = task;
        try {
          await task.promise;
        } catch (error) {
          if (gen !== generation || error?.name === "RenderingCancelledException") return;
          throw error;
        }
        if (gen !== generation) return;
        pagesEl.appendChild(canvas);
        if (first) {
          statusEl.hidden = true;
          first = false;
        }
        offset += sliceHeight;
      }
      if (gen !== generation) return;
      await placeLinks(page, cssWidth, gen);
    }

    async function placeLinks(page, cssWidth, gen) {
      const base = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale: cssWidth / base.width });
      const annotations = await page.getAnnotations();
      if (gen !== generation) return;
      for (const annotation of annotations) {
        if (annotation.subtype !== "Link" || !annotation.url) continue;
        const raw = viewport.convertToViewportRectangle(annotation.rect);
        const left = Math.min(raw[0], raw[2]);
        const top = Math.min(raw[1], raw[3]);
        const width = Math.abs(raw[2] - raw[0]);
        const height = Math.abs(raw[3] - raw[1]);
        const pad = 12;
        const link = document.createElement("a");
        link.className = "link";
        link.href = annotation.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.setAttribute("aria-label", "Телеграм-канал");
        link.style.left = (left - pad) + "px";
        link.style.top = (top - pad) + "px";
        link.style.width = (width + pad * 2) + "px";
        link.style.height = (height + pad * 2) + "px";
        pagesEl.appendChild(link);
      }
    }

    let resizeTimer = 0;
    let lastWidth = 0;
    window.addEventListener("resize", () => {
      const width = document.documentElement.clientWidth;
      if (Math.abs(width - lastWidth) < 2) return;
      window.clearTimeout(resizeTimer);
      resizeTimer = window.setTimeout(() => {
        lastWidth = document.documentElement.clientWidth;
        paint().catch(() => fail("Не удалось показать меню. Обновите страницу."));
      }, 200);
    });

    try {
      const pdfjsLib = await import(new URL("vendor/pdf.min.js", root).href);
      pdfjsLib.GlobalWorkerOptions.workerSrc = new URL("vendor/pdf.worker.min.js", root).href;
      const loadingTask = pdfjsLib.getDocument(new URL("menu.pdf", root).href);
      loadingTask.onProgress = ({ loaded, total }) => {
        if (!total) return;
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        barEl.style.width = pct + "%";
        labelEl.textContent = "Загрузка меню… " + pct + "%";
      };
      pdfDoc = await loadingTask.promise;
      labelEl.textContent = "Открываем меню…";
      lastWidth = document.documentElement.clientWidth;
      await paint();
    } catch (error) {
      console.error(error);
      fail("Не удалось открыть меню. Обновите страницу.");
    }
  </script>
  <noscript><p>Для просмотра меню нужен JavaScript.</p></noscript>
</body>
</html>
